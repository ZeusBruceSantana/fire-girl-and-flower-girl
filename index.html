<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Ember Bloom">
<meta name="theme-color" content="#1a1410">
<meta name="format-detection" content="telephone=no">
<title>Ember Bloom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body data-scene="boot">
<!--
  The world is painted on the canvas. Buttons, speech bubbles and panels are HTML in #ui above it.
  Content (names, places, items, quests, lessons) lives in the data/ folder, never here.
-->
<canvas id="world"></canvas>
<div id="ui">
  <div id="place"></div>
  <div id="cloud" data-status="offline"></div>
  <div id="seats"></div>
  <div id="corner" aria-label="grown-up corner: hold for three seconds"></div>
</div>
<div id="pick"></div>
<div id="parent"></div>
<div id="title">
  <div class="card">
    <h1 id="game-title"></h1>
    <p id="game-tagline"></p>
    <p class="tap">Tap to begin</p>
  </div>
</div>

<!-- content -->
<script src="art/overrides.js"></script>
<script src="data/world.js"></script>
<script src="data/challenges.js"></script>
<script src="data/puzzles.js"></script>
<script src="data/items.js"></script>
<script src="data/areas.js"></script>
<script src="data/quests.js"></script>
<script src="data/adventures.js"></script>
<script src="data/scenes.js"></script>
<script src="data/school.js"></script>
<script src="data/friends.js"></script>
<script src="data/myths.js"></script>
<script src="data/cases.js"></script>
<script src="data/lair.js"></script>
<script src="data/starter-words.js"></script>
<!-- the game -->
<script src="js/core.js"></script>
<script src="js/state.js"></script>
<script src="js/save.js"></script>
<script src="js/dispatch.js"></script>
<script src="js/net.js"></script>
<script src="js/presence.js"></script>
<script src="js/companion.js"></script>
<script src="js/speech.js"></script>
<script src="js/scene.js"></script>
<script src="js/hero.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/start.js"></script>
<script src="js/parent.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
