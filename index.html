<meta name="application-name" content="Ember Bloom">

<body data-scene="boot">
<!--
  The world is painted on the canvas. Buttons, speech bubbles and panels are HTML in #ui above it.
  Content (names, places, items, quests, lessons) lives in the data/ folder, never here.
-->
<canvas id="world"></canvas>
<div id="ui">
  <div id="place"></div>
  <div id="cloud" data-status="offline"></div>
  <div id="seats"></div>
  <div id="hud"></div>
  <div id="range"></div>
  <div id="corner" aria-label="grown-up corner: hold the top middle of the screen for three seconds"></div>
</div>
<div id="pick"></div>
<div id="dialogue"></div>
<div id="challenge"></div>
<div id="menu"></div>
<div id="battle"></div>
<div id="shop"></div>
<div id="storybook"></div>
<div id="artclass"></div>
<div id="lair"></div>
<div id="cases"></div>
<div id="parent"></div>
<div id="title">
  <div class="card">
    <h1 id="game-title"></h1>
    <p id="game-tagline"></p>
    <p class="tap">Tap to begin</p>
  </div>
</div>

<!-- content -->
<script src="art/overrides.js"></script>
