# Ember Bloom relay. Deploy with: npx wrangler deploy   (from this folder, after `npx wrangler login`)
name = "ember-bloom-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
